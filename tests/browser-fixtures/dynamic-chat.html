<!doctype html><html><head><title>Editable dynamic messenger</title></head><body><main><h2>Messages</h2><article id="messages">First message</article><div contenteditable="true" role="textbox" aria-label="Compose message" id="editor"></div><button type="button" id="send">Send</button></main><script>window.sends=0;document.getElementById('send').onclick=()=>{window.sends++;const text=document.getElementById('editor').textContent;document.getElementById('editor').replaceChildren();setTimeout(()=>{const message=document.createElement('article');message.textContent='New message: '+text;document.getElementById('messages').append(message);},60)};</script></body></html>
