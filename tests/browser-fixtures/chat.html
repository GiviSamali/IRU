<!doctype html><html><head><title>Modern controlled chat</title></head><body><main><h1>AI conversation fixture</h1><section id="messages"><p>Assistant: Welcome to the conversation.</p></section><textarea aria-label="Message" id="composer"></textarea><button id="send" type="button" aria-label="Send message">Send</button></main><script>let frameworkState='';window.sends=0;const composer=document.getElementById('composer');const native=Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype,'value');Object.defineProperty(composer,'value',{get(){return native.get.call(this)},set(value){window.instanceSetterUsed=true;native.set.call(this,value)}});composer.addEventListener('input',()=>{frameworkState=native.get.call(composer);window.frameworkDraft=frameworkState;});document.getElementById('send').addEventListener('click',()=>{if(!frameworkState)return;window.sends++;const msg=document.createElement('p');msg.textContent='User: '+frameworkState;document.getElementById('messages').append(msg);native.set.call(composer,'');frameworkState='';setTimeout(()=>{const reply=document.createElement('p');reply.textContent='Assistant: Connection acknowledged.';document.getElementById('messages').append(reply);},120);});</script></body></html>
