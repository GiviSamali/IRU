<!doctype html><html><head><title>Universal form</title></head><body><main><h1>Ordinary HTML form</h1><p>Visible useful information.</p><p hidden>Hidden private junk</p><div style="display:none"><button>Invisible button</button>hidden descendant</div><div aria-hidden="true">ARIA hidden junk</div><div style="opacity:0">Transparent hidden junk</div><label for="name">Full name</label><input id="name" type="text"><label for="notes">Notes</label><textarea id="notes"></textarea><div role="textbox" aria-label="Rich text" contenteditable="true"></div><input type="password" value="secret-password"><input type="file"><button id="send" type="button">Send</button><button type="button">Delete account</button><button disabled>Unavailable</button><a href="/chat.html">Next page</a><a href="javascript:alert(1)">Unsafe script link</a><p id="result"></p></main><script>window.events={keyboard:0,pointer:0,input:0,change:0,sends:0};for(const type of ['keydown','keyup','keypress'])document.addEventListener(type,()=>events.keyboard++);for(const type of ['mousedown','mouseup','pointerdown','pointerup'])document.addEventListener(type,()=>events.pointer++);document.addEventListener('input',()=>events.input++);document.addEventListener('change',()=>events.change++);document.getElementById('send').addEventListener('click',()=>{events.sends++;document.getElementById('result').textContent='Submitted once';});</script></body></html>
