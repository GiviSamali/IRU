<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRU Living Architecture</title><link rel="stylesheet" href="src/style.css"><script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head><body>
<header><strong>IRU <span>Living Architecture</span></strong><nav><button data-mode="Architecture" class="active">Architecture</button><button data-mode="Relationships">Relationships</button><button data-mode="Execution">Execution</button></nav><small id="sha"></small></header>
<main><aside id="left"><div class="heading">Архитектура <button id="hideLeft">‹</button></div><input id="search" placeholder="Модули, классы, функции…"><div id="tree"></div></aside><section id="viewport"><div id="toolbar"><button id="showLeft">Дерево</button><button id="home">Общий вид</button><button id="full">Полный граф</button><button id="parent">К родителю</button><select id="quality"><option value="1">Стандарт</option><option value="2">Высокое качество</option><option value="0.75">Экономия GPU</option></select></div><div id="labels"></div><div id="legend">Один граф · стабильная раскладка · связи из исходников<br>Вращение: мышь · масштаб: колесо · панорама: правая кнопка</div><div id="notice"></div></section><aside id="right"><div class="heading">Сведения <button id="hideRight">›</button></div><div id="details">Выберите узел в пространстве или дереве.</div><hr><label>Зависимости <select id="direction"><option value="both">Все</option><option value="in">Входящие</option><option value="out">Исходящие</option></select></label><label><input type="checkbox" id="transitive">Транзитивные</label><label><input type="checkbox" class="edgeType" value="import" checked>Импорты</label><label><input type="checkbox" class="edgeType" value="static_call" checked>Статические вызовы</label><button id="routeStart">Начало маршрута</button><button id="routeEnd">Маршрут к выбранному</button><p id="routeResult"></p></aside></main>
