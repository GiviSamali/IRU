<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRU Living Architecture</title><link rel="stylesheet" href="src/style.css"><script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head><body>
<header><strong>IRU <span>Living Architecture</span></strong><nav><button data-mode="Architecture" class="active">Architecture</button><button data-mode="Relationships">Relationships</button><button data-mode="Execution">Execution</button></nav><small id="sha"></small></header>
<main>
<aside id="left"><div class="heading">Архитектура <button id="hideLeft">‹</button></div><button id="physical">Исходники</button><input id="search" placeholder="Компоненты, механизмы, функции…"><div id="tree"></div></aside>
<aside id="diagnostics" hidden aria-label="Аномалии"></aside>
<section id="viewport"><div id="toolbar"><button id="showLeft">Дерево</button><button id="showRight">Сведения</button><button id="overview">Overview</button><button id="home">Общий вид</button><button id="core">Ядро</button><button id="constellation">Созвездие</button><button id="full">Полный граф</button><button id="focusNode">Фокус узла</button><button id="parent">К родителю</button><button id="clearSelection">Сбросить выделение</button><button id="anomalies">Аномалии</button><button id="pathMode">Путь между узлами</button><select id="quality"><option value="1">Стандарт</option><option value="2">Высокое качество</option><option value="0.75">Экономия GPU</option></select><label class="compact">Свечение <select id="glow"><option value="1">Мягкое</option><option value="0">Выкл.</option><option value="0.5">Слабое</option></select></label></div><div id="labels"></div><div id="legend"><span id="highlightStatus">Overview · без выделения</span><br>Один клик — выделение · двойной — сведения · ▸ — раскрытие дерева<br>Вращение: мышь · масштаб: колесо · панорама: правая кнопка</div><div id="notice"></div></section>
<aside id="right" hidden><div class="heading">Сведения <button id="hideRight">›</button></div><div id="details">Выберите узел и откройте сведения.</div><hr><label>Зависимости <select id="direction"><option value="both">Все</option><option value="in">Входящие</option><option value="out">Исходящие</option></select></label><label><input type="checkbox" id="transitive">Транзитивные</label><div id="edgeFilters"></div></aside>
</main>
<footer id="pathPanel" hidden aria-label="Путь между узлами"></footer>
<footer id="execution" hidden><div class="controls"><label class="file">Импорт JSON <input type="file" id="import" accept=".json,application/json"></label><button id="demo">DEMO / SYNTHETIC</button><button id="previous">←</button><button id="play">▶</button><button id="next">→</button><button id="stopExecution">Остановить трассу</button><select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select><button id="focusTrace">Фокус события</button><span id="traceName">Локальная трасса не загружена</span></div><input id="timeline" type="range" min="0" max="0" value="0"><div id="eventButtons"></div><pre id="eventDetails"></pre></footer>
<script type="module" src="src/app.mjs"></script></body></html>
